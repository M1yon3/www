<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロパティ</title>
<style>
   body {
     font-family: sans-serif;
   }
   .box {
     border: 2px solid #777;
     padding: 20px;
     margin: 20px 0;
   }
   button {
     padding: 8px 16px;
     font-size: 14px;
   }
   .result {
     border: 2px solid #777;
     padding: 10px;
     margin-top: 20px;
   }
</style>
</head>
<body>
<h1>HTMLの表示</h1>
<p>ボックス内の表示されている部分のHTMLを表示します。</p>
<div class="box" id="box">
<h3>人口800万人以上の都道府県</h3>
<ul>
<li>東京都</li>
<li>神奈川県</li>
<li>大阪府</li>
</ul>
</div>
<button onclick="showHTML()">HTMLを表示</button>
<div class="result" id="result">
   ここにHTMLが表示されます。
</div>
<script>
   function showHTML() {
     const target = document.getElementById("box");
     const htmlText = target.innerHTML;
     document.getElementById("result").innerText = htmlText;
   }
</script>
</body>
</html>
